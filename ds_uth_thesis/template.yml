jtex: v1
title: DS_UTH_Thesis
description: Template for UTH students
version: "1.0.0"

authors:
  - name: Charalampos Anastasiou
    affiliations:
      - DS UTH

license: CC-BY-4.0
thumbnail: ./thumbnail.png
tags:
  - book

style:
  bibliography: natbib

doc:
  - id: title
    required: true
  - id: subtitle
  - id: bibliography

options:
  - id: university
    title: University
    type: string
  - id: school
    title: School
    type: string
  - id: department
    title: Department
    type: string
  - id: thesis_title
    title: Thesis Title
    type: string
  - id: student_name
    title: Student name
    type: string
  - id: student_id
    title: Student ID
    type: string
  - id: city
    title: City
    type: string
  - id: thesis_date
    title: Thesis date
    type: string
  - id: approval_date
    title: Approval Date
    type: string
  - id: signature_path
    title: Signature Image Path
    type: string
  - id: thesis_abstract
    title: Thesis Abstract
    type: string
  - id: supervisor_name
    title: Supervisor Name
    type: string
  - id: supervisor_rank
    title: Supervisor Rank
    type: string
  - id: supervisor_dept
    title: Supervisor Department
    type: string
  - id: member1_name
    title: Committee Member 1 Name
    type: string
  - id: member1_title
    title: Committee Member 1 Title
    type: string
  - id: member2_name
    title: Committee Member 2 Name
    type: string
  - id: member2_title
    title: Committee Member 2 Title
    type: string

files:
  - template.tex

packages:
  - caption
  - enumitem
  - framed
  - geometry
  - graphicx
  - hyperref
  - natbib
  - xcolor
  - changepage
  - amssymb
  - amsmath
  - fancyhdr
  - polyglossia
