        thesis_abstract_greek:
          Η πτυχιακή εργασία αρχικά παρουσιάζει την γλώσσα σήμανσης Markdown και
          το οικοσύστημα των εργαλείων της. Στην συνέχεια εστιάζει στην διάλεκτο
          Markdown MyST και τις δυνατότητες της, η οποία είναι κατάλληλη για
          επιστημονικά και τεχνικά έγγραφα όπως πτυχιακές εργασίες. Στο πλαίσιο
          της εργασίας θα δημιουργηθεί ένα πρότυπο MyST για Πτυχιακές Εργασίες
          στο Τμήμα Ψηφιακών Συστημάτων, αντίστοιχο με το παρόν πρότυπο
          Microsoft Word. Παράλληλα θα αναλυθεί η διαδικασία δημιουργίας
          προτύπων με τα εργαλεία του MyST και θα παρουσιαστούν τα πλεονεκτήματα
          χρήσης του Markdown.

        thesis_abstract_english:
          The thesis initially presents the Markdown markup language and its ecosystem of tools.
          It then focuses on the Markdown MyST dialect and its capabilities, which make it suitable
          for scientific and technical documents such as undergraduate theses. As part of the
          project, a MyST template for undergraduate theses in the Department of Digital Systems
          will be developed, corresponding to the current Microsoft Word template. At the same time,
          the process of creating templates using MyST tools will be analyzed, and the advantages
          of using Markdown will be presented.


